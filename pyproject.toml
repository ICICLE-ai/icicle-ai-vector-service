[project]
name = "icicle-ai-vector-service"
version = "1.0.0"
description = "ICICLE AI Vector Service (FastAPI + Qdrant)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "qdrant-client>=1.12",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",

  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
# Cross-encoder reranking. Kept optional because torch pulls the image from
# ~200MB to ~1.5GB; without it the service still runs and only the
# "cross_encoder" rerank method is unavailable. The published image installs it.
rerank = [
  "sentence-transformers>=3.0",
  # CPU-only torch. Install from the CPU wheel index to avoid the ~2.5GB of
  # bundled CUDA libraries, which are dead weight on a CPU pod:
  #   pip install torch --index-url https://download.pytorch.org/whl/cpu
  "torch>=2.2",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/ICICLE-ai/icicle-ai-vector-service"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Tests import as `tests.conftest`, so the repo root must be importable.
pythonpath = ["."]
filterwarnings = [
  # In-memory Qdrant warns that payload indexes do nothing locally. That is
  # expected: the indexes matter against a real server, and creating them is
  # deliberately best-effort.
  "ignore:Payload indexes have no effect:UserWarning",
  "ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
# The floor is below 100 on purpose: the uncovered remainder is code that only
# runs when torch is absent, or that wraps a live network call.
fail_under = 95
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "pragma: no cover",
]
