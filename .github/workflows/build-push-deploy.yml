name: Build & Push & Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  TAPIS_ISSUER: ${{ vars.TAPIS_ISSUER }}
  TAPIS_JWKS_URL: ${{ vars.TAPIS_JWKS_URL }}
  TAPIS_TENANT_ID: ${{ vars.TAPIS_TENANT_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install --upgrade uv

      # Torch is installed on its own, from the CPU wheel index only. Passing that
      # index alongside PyPI makes uv resolve *every* package against it (its
      # dependency-confusion guard: first index that has a package wins), and the
      # PyTorch index carries an old pinned urllib3 that qdrant-client rejects.
      # Installing torch first, then the project from PyPI, keeps each index
      # scoped to what it is actually for.
      - name: Install CPU-only torch
        run: |
          uv pip install --system torch \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install project (with rerank extra)
        run: uv pip install --system ".[rerank,dev]"

      # The suite is hermetic: an in-memory Qdrant and a stubbed current-user
      # dependency, so it needs no Qdrant server and no Tapis token. The env
      # vars below only satisfy Settings(), which is built at import time.
      # Coverage is enforced (fail_under in pyproject), so a drop fails the build.
      - name: Run tests
        env:
          QDRANT_URL: http://localhost:6333
          TAPIS_ISSUER: https://example.tapis.io/v3/tokens
          TAPIS_JWKS_URL: https://example.tapis.io/v3/tokens/.well-known/jwks.json
          TAPIS_TENANT_ID: icicleai
        run: pytest -q --cov

      - name: Check openapi.json is up to date
        env:
          QDRANT_URL: http://localhost:6333
          TAPIS_ISSUER: https://example.tapis.io/v3/tokens
          TAPIS_JWKS_URL: https://example.tapis.io/v3/tokens/.well-known/jwks.json
          TAPIS_TENANT_ID: icicleai
        run: |
          python scripts/export_openapi.py --check

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'pull_request'
    # Native linux/amd64 on ubuntu-latest (same pattern as other ICICLE GHCR workflows: no platforms:).
    timeout-minutes: 35

    permissions:
      contents: write   # required by softprops/action-gh-release to create Releases
      packages: write

    outputs:
      version_tag: ${{ steps.tags.outputs.version_tag }}
      image_tags: ${{ steps.tags.outputs.image_tags }}
      image_name: ${{ steps.tags.outputs.image_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compute Docker tags
        id: tags
        shell: bash
        run: |
          # GHCR requires a lowercase path, but org and repo names may carry
          # capitals (ICICLE-ai/...), so normalise. Falls back to this repo when
          # the IMAGE_NAME variable is not set, which also keeps forks working.
          NAME="${{ env.IMAGE_NAME }}"
          NAME="${NAME:-${{ github.repository }}}"
          NAME="$(echo "$NAME" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${NAME}"
          echo "Publishing to ${IMAGE}"
          echo "image_name=${NAME}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"

            echo "version_tag=${VERSION}" >> "$GITHUB_OUTPUT"

            {
              echo "image_tags<<EOF"
              echo "${IMAGE}:latest"
              echo "${IMAGE}:${VERSION}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=latest" >> "$GITHUB_OUTPUT"

            {
              echo "image_tags<<EOF"
              echo "${IMAGE}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.image_tags }}
          # OCI labels surface metadata in the GHCR Packages sidebar (Source link,
          # description, version) and tie each image back to the commit it was built from.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ICICLE AI Vector Service — FastAPI + Qdrant
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version_tag }}
            org.opencontainers.image.title=icicle-ai-vector-service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Checks the built image rather than the repo: that the package imports
      # under the installed layout, that every expected route registers, and
      # whether the optional [rerank] extra made it in. A bare import list would
      # miss a dropped route or a torch-less build.
      - name: Smoke-test latest image
        run: |
          docker run --rm --entrypoint python \
            -e QDRANT_URL="http://localhost:6333" \
            -e TAPIS_ISSUER="$TAPIS_ISSUER" \
            -e TAPIS_JWKS_URL="$TAPIS_JWKS_URL" \
            -e TAPIS_TENANT_ID="$TAPIS_TENANT_ID" \
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.image_name }}:latest \
            -c "from src.app import __version__, reranking; from src.app.main import app; paths = sorted({r.path for r in app.routes if getattr(r, 'methods', None)}); expected = ['/healthz', '/v1/collections', '/v1/collections/{collection}', '/v1/embeddings', '/v1/embeddings/bulk-delete', '/v1/rerank', '/v1/rerank/methods', '/v1/retrieve']; missing = [p for p in expected if p not in paths]; assert not missing, f'missing routes: {missing}'; print(f'v{__version__}: {len(paths)} routes ok, cross_encoder={reranking.is_available()}')"

      # On a v*.*.* tag push, populate the repo's "Releases" sidebar with an
      # auto-generated changelog (built from PR titles since the previous tag).
      # Skipped on regular main pushes — those only update :latest, no Release.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          name: v${{ steps.tags.outputs.version_tag }}
          body: |
            Container image: `ghcr.io/${{ needs.build-and-push-images.outputs.image_name }}:${{ steps.tags.outputs.version_tag }}`

            Image is **linux/amd64** (GitHub `ubuntu-latest` default; no cross-arch build).

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [build-and-push-images]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # ~2 min sleep + bounded HTTP; fail fast if deploy is wedged.
    timeout-minutes: 12

    steps:
      - name: Restart production Tapis pod
        timeout-minutes: 2
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://icicleai.tapis.io/v3/pods/${{ vars.POD_ID }}/restart'
          method: 'GET'
          customHeaders: '{"Content-Type": "application/json", "X-Tapis-Token": "${{ secrets.TAPIS_ICICLE_PROD_TOKEN }}"}'

      - name: Wait for pod restart
        run: sleep 120

      - name: Check production health
        timeout-minutes: 4
        run: |
          curl --fail --show-error --silent \
            --connect-timeout 10 \
            --max-time 25 \
            --retry 3 \
            --retry-delay 4 \
            "${{ vars.PROD_BASE_URL }}/healthz"
